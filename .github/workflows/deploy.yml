name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify source and Firebase configuration
        run: |
          node scripts/check-secrets.mjs
          node -e 'if (!process.env.VITE_FIREBASE_API_KEY?.trim()) { console.error("Missing repository Secret VITE_FIREBASE_API_KEY. Deployment stopped to preserve the live guestbook."); process.exit(1) }'
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Read GitHub Pages domain and base path
        uses: actions/configure-pages@v5
        id: pages
      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          VITE_MUSIC_ORIGINAL_URL: ${{ vars.VITE_MUSIC_ORIGINAL_URL }}
          VITE_MUSIC_BANGBANGBANG_URL: ${{ vars.VITE_MUSIC_BANGBANGBANG_URL }}
          VITE_MUSIC_BAD_URL: ${{ vars.VITE_MUSIC_BAD_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
